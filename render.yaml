# Render Blueprint — SettlementOS Explorer (Node web + MCP)
# Dashboard: New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: settlementos-explorer
    runtime: node
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      # October 21, 2026 security release. Local and CI stay on Node 22 (D39).
      - key: NODE_VERSION
        value: "26.12.1"
      - key: VITE_ETHERSCAN_API_KEY
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: MCP_OAUTH_CLIENT_ID
        sync: false
      - key: MCP_OAUTH_CLIENT_SECRET
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
